name: Build & Publish

on:
  push:
    branches: [ main, master ]
    tags: [ v* ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write
  id-token: write   # required for NuGet Trusted Publishing (OIDC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  buildConfiguration: Release
  # Kill switch for NuGet publishing: set to 'false' to skip the Push (Release) step.
  publishEnabled: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    # Secrets cannot be referenced from the workflow-level env block, so this is lifted to the job
    # to let the publishing steps test for it in their if conditions.
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: 6.x

    - name: Execute GitVersion
      uses: gittools/actions/gitversion/execute@v4
      id: gitversion

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.x
          10.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build -c ${{ env.buildConfiguration }} --no-restore -p:Version=${{ steps.gitversion.outputs.semVer }} -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} -p:AssemblyVersion=1.0.0.0

    - name: Test
      run: dotnet test -c ${{ env.buildConfiguration }} --no-build -v normal --filter FullyQualifiedName!~IntegrationTests --collect:"XPlat Code Coverage" --results-directory ${{ github.workspace }}/coverage

    - name: Generate coverage summary
      if: ${{ !cancelled() }}
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
      with:
        reports: ${{ github.workspace }}/coverage/**/coverage.cobertura.xml
        targetdir: ${{ github.workspace }}/coveragereport
        reporttypes: MarkdownSummaryGithub

    - name: Publish coverage in job summary
      if: ${{ !cancelled() }}
      run: cat ${{ github.workspace }}/coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    - name: Comment coverage on pull request
      # Fork PRs only get a read-only token, so this cannot post there
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.number }}
      run: gh pr comment $PR_NUMBER --edit-last --create-if-none --body-file ${{ github.workspace }}/coveragereport/SummaryGithub.md

    - name: Upload coverage
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: ${{ github.workspace }}/coverage/**/coverage.cobertura.xml

    - name: Pack
      run: dotnet pack -c ${{ env.buildConfiguration }} -p:PackageOutputPath="${{ github.workspace }}/artifacts/" -p:PackageVersion=${{ steps.gitversion.outputs.semVer }}

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: |
          ${{ github.workspace }}/artifacts/*.nupkg
          ${{ github.workspace }}/artifacts/*.snupkg

    # Trusted Publishing: exchanges a GitHub OIDC token for an API key that is valid for 1 hour,
    # so this must run immediately before the push rather than earlier in the job.
    # Both steps are skipped when the NUGET_USER secret is absent, so a repo without
    # publishing configured still gets a green build.
    - name: NuGet login (OIDC)
      id: nuget-login
      if: ${{ env.publishEnabled == 'true' && github.event_name == 'push' && env.NUGET_USER != '' }}
      uses: NuGet/login@v1
      with:
        user: ${{ env.NUGET_USER }}

    - name: Push (Release)
      if: ${{ env.publishEnabled == 'true' && github.event_name == 'push' && env.NUGET_USER != '' }}
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "${{ github.workspace }}/artifacts/"*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
