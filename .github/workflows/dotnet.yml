name: Build & Publish

on:
  push:
    branches: [ main, master ]
    tags: [ v* ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  buildConfiguration: Release
  # TEMPORARY: publishing to NuGet is disabled while the workflow changes are being verified.
  # Set back to 'true' to re-enable the Push (Release) step.
  publishEnabled: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: 6.x

    - name: Execute GitVersion
      uses: gittools/actions/gitversion/execute@v4
      id: gitversion

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.x
          10.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build -c ${{ env.buildConfiguration }} --no-restore -p:Version=${{ steps.gitversion.outputs.semVer }} -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} -p:AssemblyVersion=1.0.0.0

    - name: Test
      run: dotnet test -c ${{ env.buildConfiguration }} --no-build -v normal --filter FullyQualifiedName!~IntegrationTests

    - name: Pack
      run: dotnet pack -c ${{ env.buildConfiguration }} -p:PackageOutputPath="${{ github.workspace }}/artifacts/" -p:PackageVersion=${{ steps.gitversion.outputs.semVer }}

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: |
          ${{ github.workspace }}/artifacts/*.nupkg
          ${{ github.workspace }}/artifacts/*.snupkg

    - name: Push (Release)
      env:
        NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      if: ${{ env.publishEnabled == 'true' && github.event_name == 'push' && env.NUGET_SOURCE != '' }}
      run: dotnet nuget push "${{ github.workspace }}/artifacts/"*.nupkg -s "$NUGET_SOURCE" -k "$NUGET_API_KEY" --skip-duplicate
